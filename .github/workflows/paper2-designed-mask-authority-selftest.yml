name: paper2-designed-mask-authority-selftest

on:
  pull_request:
    paths:
      - "research/paper2/designed_extraction_mask_terms_v1.json"
      - "scripts/paper2_designed_mask_authority_validate.py"
      - "research/paper2/designed_corpus_geometry_v1.json"
      - "research/paper2/extraction_label_mask_v1.json"
      - "scripts/paper2_extraction_two_pass_prepare.py"
      - ".github/workflows/paper2-designed-mask-authority-selftest.yml"
  push:
    branches: [main]
    paths:
      - "research/paper2/designed_extraction_mask_terms_v1.json"
      - "scripts/paper2_designed_mask_authority_validate.py"
      - "research/paper2/designed_corpus_geometry_v1.json"
      - "research/paper2/extraction_label_mask_v1.json"
      - "scripts/paper2_extraction_two_pass_prepare.py"
      - ".github/workflows/paper2-designed-mask-authority-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile scripts/paper2_designed_mask_authority_validate.py
      - name: Parse mask authority
        run: python -m json.tool research/paper2/designed_extraction_mask_terms_v1.json >/dev/null
      - name: Run destructive designed-mask self-test
        run: python scripts/paper2_designed_mask_authority_validate.py --self-test
