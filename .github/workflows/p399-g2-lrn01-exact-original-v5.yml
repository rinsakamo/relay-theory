name: P399 G2 LRN01 independently repeated publisher exact original
on:
  pull_request:
    paths:
      - "research/paper2/p399/g2/g2_lrn01_independent_exact_original_v5.py"
      - ".github/workflows/p399-g2-lrn01-exact-original-v5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lrn01-publisher-raw-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'playwright==1.55.0' 'pypdf==6.1.1'
      - run: python -m playwright install --with-deps chromium
      - run: python research/paper2/p399/g2/g2_lrn01_independent_exact_original_v5.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p399-g2-lrn01-original-reacquisition-metadata-${{ github.run_id }}
          path: g2-lrn01/independent_original_receipt.json
          retention-days: 14
