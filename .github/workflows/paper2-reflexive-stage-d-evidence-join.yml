name: paper2-reflexive-stage-d-evidence-join

on:
  pull_request:
    paths:
      - '.github/workflows/paper2-reflexive-stage-d-evidence-join.yml'
      - 'paper/validation/jgps-major-revision/reflexive-audit-v1/**'
      - 'scripts/paper2_reflexive_stage_d_join_validate.py'
  workflow_dispatch:

jobs:
  joined-frozen-evidence-after-frozen-fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reverify independent prefit Stage D and frozen Stage C
        run: |
          python scripts/paper2_reflexive_stage_d_validate.py
          python scripts/paper2_reflexive_evidence_profile_validate.py
      - name: Compile independent postfit join validator
        run: python -m py_compile scripts/paper2_reflexive_stage_d_join_validate.py
      - name: Verify postfit evidence join deterministically
        run: python scripts/paper2_reflexive_stage_d_join_validate.py
