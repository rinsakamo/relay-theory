name: paper2-assertion-carrier-v2

on:
  push:
    branches:
      - paper2-assertion-carrier-v2-384
    paths:
      - "paper/validation/jgps-major-revision/l-claim-assertion-carrier-schema-v2.json"
      - "paper/validation/jgps-major-revision/assertion-carrier-v2-derivation-v1.json"
      - "paper/validation/jgps-major-revision/ahv8-assertion-carrier-v2-retrospective-calibration-v1.json"
      - "paper/validation/jgps-major-revision/ahv8-assertion-carrier-heldout-validation-v1.json"
      - "paper/validation/jgps-major-revision/ahv8-claimir-human-reviewed-v1/**"
      - "scripts/paper2_assertion_carrier_v2_validate.py"
      - ".github/workflows/paper2-assertion-carrier-v2.yml"
  pull_request:
    paths:
      - "paper/validation/jgps-major-revision/l-claim-assertion-carrier-schema-v2.json"
      - "paper/validation/jgps-major-revision/assertion-carrier-v2-derivation-v1.json"
      - "paper/validation/jgps-major-revision/ahv8-assertion-carrier-v2-retrospective-calibration-v1.json"
      - "paper/validation/jgps-major-revision/ahv8-assertion-carrier-heldout-validation-v1.json"
      - "paper/validation/jgps-major-revision/ahv8-claimir-human-reviewed-v1/**"
      - "scripts/paper2_assertion_carrier_v2_validate.py"
      - ".github/workflows/paper2-assertion-carrier-v2.yml"

permissions:
  contents: read

jobs:
  assertion-carrier-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/paper2_assertion_carrier_v2_validate.py
      - name: Validate twice and compare
        run: |
          python scripts/paper2_assertion_carrier_v2_validate.py --output /tmp/acv2-a.json
          python scripts/paper2_assertion_carrier_v2_validate.py --output /tmp/acv2-b.json
          cmp /tmp/acv2-a.json /tmp/acv2-b.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: paper2-assertion-carrier-v2-receipt
          path: /tmp/acv2-a.json
