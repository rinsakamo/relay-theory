name: P399 G1 non-PLOS VOR ORIGINAL accessibility (not admission)
on:
  pull_request:
    paths:
      - "research/paper2/p399/g1/alternative_original_publisher_probe.py"
      - ".github/workflows/p399-g1-alternative-original-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g1-alternative-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check 'pypdf==6.1.1'
      - run: python research/paper2/p399/g1/alternative_original_publisher_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p399-g1-non-plos-metadata-${{ github.run_id }}
          path: g1-alt-receipts/alternatives.json
          if-no-files-found: warn
          retention-days: 14
