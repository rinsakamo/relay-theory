name: P399 MAIN M9B auditability

on:
  workflow_dispatch:
  push:
    branches:
      - paper2/p399-main-m9b-auditability-20261005
  pull_request:
    branches:
      - paper2/p399-main-m9a-categorical-lifts-20261005

permissions:
  contents: read

concurrency:
  group: p399-main-m9b-auditability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m9b-auditability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact M9B base ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE="1938a09e119860dc3d4325b86b1ce5b8bab62fd5"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-list --count "${BASE}..HEAD")" -ge 1

      - name: Enforce M9B isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="1938a09e119860dc3d4325b86b1ce5b8bab62fd5"
          cat > "$RUNNER_TEMP/expected-m9b-paths.txt" <<'EOF'
          .github/workflows/p399-main-m9b-auditability.yml
          paper/venues/jgps/main.tex
          research/paper2/p399/main/integration/M9B/M9B_A012_OPERATIONAL_DECISION_TREE_v1.json
          research/paper2/p399/main/integration/M9B/M9B_A012_OPERATIONAL_DECISION_TREE_v1.md
          research/paper2/p399/main/integration/M9B/M9B_FREEZE_CHRONOLOGY_v1.json
          research/paper2/p399/main/integration/M9B/M9B_FREEZE_CHRONOLOGY_v1.md
          research/paper2/p399/main/integration/M9B/M9B_MAIN40_PAPER_LEVEL_EVIDENCE_v1.json
          research/paper2/p399/main/integration/M9B/M9B_MAIN40_PAPER_LEVEL_EVIDENCE_v1.md
          research/paper2/p399/main/integration/M9B/M9B_SINGLE_ADJUDICATOR_BOUNDARY_v1.md
          research/paper2/p399/main/integration/M9B/test_m9b_auditability.py
          EOF
          git diff --name-only "${BASE}..HEAD" | sort > "$RUNNER_TEMP/actual-m9b-paths.txt"
          diff -u "$RUNNER_TEMP/expected-m9b-paths.txt" "$RUNNER_TEMP/actual-m9b-paths.txt"

      - name: Run M9B fail-closed guardrails
        shell: bash
        run: |
          set -euo pipefail
          python research/paper2/p399/main/integration/M9B/test_m9b_auditability.py

      - name: Guard manuscript claim boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Independent human re-adjudication was not performed" paper/venues/jgps/main.tex
          grep -F "procedural auditability under a single-adjudicator design rather than inter-rater reliability" paper/venues/jgps/main.tex
          ! grep -Fi "independently validated" paper/venues/jgps/main.tex


      - name: Install LaTeX build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra texlive-pictures \
            poppler-utils

      - name: Build revised JGPS manuscript fail-closed
        run: |
          set -euo pipefail
          cd paper/venues/jgps
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -En 'LaTeX Warning:|Package .* Warning:|Overfull \\hbox|Citation .* undefined|Reference .* undefined' main.log; then exit 1; fi
          pdftotext main.pdf main.txt
          tr '\n' ' ' < main.txt | tr -s '[:space:]' ' ' > main.flat.txt
          grep -F "Post-hoc falsifiability calibration of the A-state rule" main.flat.txt
          grep -F "Independent human re-adjudication was not performed" main.flat.txt
          grep -F "uniform descriptive compatibility with direct composition" main.flat.txt
          echo "M9B_JGPS_BUILD_PASS" >> "$GITHUB_STEP_SUMMARY"
