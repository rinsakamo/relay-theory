name: paper2-v3-real-calibration-transaction-selftest

on:
  pull_request:
    paths:
      - "scripts/paper2_extraction_two_pass_llama_cpp_transaction_v3.py"
      - "research/paper2/extraction_v3_real_calibration_transaction_v1.json"
      - "scripts/paper2_extraction_two_pass_systemone_v3.py"
      - "research/paper2/extraction_two_pass_systemone_v3.json"
      - "research/paper2/extraction_systemone_decision_v3.schema.json"
      - "research/paper2/claim_ir_v1.schema.json"
      - "scripts/paper2_extraction_two_pass_llama_cpp_transaction_v2.py"
      - ".github/workflows/paper2-v3-real-calibration-transaction-selftest.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/paper2_extraction_two_pass_llama_cpp_transaction_v3.py"
      - "research/paper2/extraction_v3_real_calibration_transaction_v1.json"
      - "scripts/paper2_extraction_two_pass_systemone_v3.py"
      - "research/paper2/extraction_two_pass_systemone_v3.json"
      - "research/paper2/extraction_systemone_decision_v3.schema.json"
      - "research/paper2/claim_ir_v1.schema.json"
      - "scripts/paper2_extraction_two_pass_llama_cpp_transaction_v2.py"
      - ".github/workflows/paper2-v3-real-calibration-transaction-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile v3 real-calibration transaction runner
        run: python -m py_compile scripts/paper2_extraction_two_pass_llama_cpp_transaction_v3.py
      - name: Re-run frozen SystemOne v3 synthetic qualification
        run: python scripts/paper2_extraction_two_pass_systemone_v3.py --self-test
      - name: Run staged real-calibration runner destructive self-test
        run: python scripts/paper2_extraction_two_pass_llama_cpp_transaction_v3.py --self-test
