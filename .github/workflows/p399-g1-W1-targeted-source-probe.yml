name: P399 G1 W1 original-source targeted byte and bounded-page probe
on:
  push:
    branches:
      - "paper2/p399-g1-w1-source-adversarial-20261004"
    paths:
      - "research/paper2/p399/g1/parallel/W1/w1_targeted_original_source_probe.py"
      - ".github/workflows/p399-g1-W1-targeted-source-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w1-targeted-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'pypdf==6.1.1' 'pymupdf==1.26.4'
      - run: python research/paper2/p399/g1/parallel/W1/w1_targeted_original_source_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p399-g1-W1-targeted-official-source-${{ github.run_id }}
          path: w1-source-probe/
          retention-days: 21
          if-no-files-found: warn
