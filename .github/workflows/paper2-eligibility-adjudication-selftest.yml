name: paper2-eligibility-adjudication-selftest

on:
  pull_request:
    paths:
      - "research/paper2/eligibility_source_bundle_v1.schema.json"
      - "research/paper2/eligibility_decision_v1.schema.json"
      - "research/paper2/eligibility_adjudication_v1.json"
      - "research/paper2/eligibility_adjudication_prompt_v1.md"
      - "scripts/paper2_eligibility_adjudication_validate.py"
      - ".github/workflows/paper2-eligibility-adjudication-selftest.yml"
  push:
    branches:
      - main
    paths:
      - "research/paper2/eligibility_source_bundle_v1.schema.json"
      - "research/paper2/eligibility_decision_v1.schema.json"
      - "research/paper2/eligibility_adjudication_v1.json"
      - "research/paper2/eligibility_adjudication_prompt_v1.md"
      - "scripts/paper2_eligibility_adjudication_validate.py"
      - ".github/workflows/paper2-eligibility-adjudication-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile eligibility adjudication apparatus
        run: python -m py_compile scripts/paper2_eligibility_adjudication_validate.py
      - name: Run deterministic eligibility adjudication self-test
        run: python scripts/paper2_eligibility_adjudication_validate.py --self-test
