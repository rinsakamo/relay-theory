name: paper2-ctl-structural-adjudication-selftest

on:
  pull_request:
    branches:
      - paper2-reference-structural-adjudication-v1-267
    paths:
      - "research/paper2/reference_structural_adjudication_v1/CTL*.json"
      - "research/paper2/chatgpt_reference_claimir_v1/CTL*.json"
      - "scripts/paper2_reference_structural_adjudication.py"
      - "scripts/paper2_phi_compare.py"
      - ".github/workflows/paper2-ctl-structural-adjudication-selftest.yml"

permissions:
  contents: read

jobs:
  ctl-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile frozen checkers
        run: |
          python -m py_compile scripts/paper2_reference_structural_adjudication.py
          python -m py_compile scripts/paper2_phi_compare.py
      - name: Validate changed CTL adjudications sequentially
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" --               'research/paper2/reference_structural_adjudication_v1/CTL*.json' |
            sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed CTL adjudication files."
            exit 0
          fi
          for adj in "${files[@]}"; do
            claim="$(basename "${adj}" .json)"
            claim_ir="research/paper2/chatgpt_reference_claimir_v1/${claim}.json"
            structural="/tmp/${claim}.structural.json"
            phi="/tmp/${claim}.phi.json"
            echo "=== ${claim} ==="
            python scripts/paper2_reference_structural_adjudication.py               --claim-ir "${claim_ir}"               --adjudication "${adj}"               --output "${structural}"
            python scripts/paper2_phi_compare.py               --project "${structural}"               > "${phi}"
            python -m json.tool "${structural}" >/dev/null
            python -m json.tool "${phi}" >/dev/null
            sha256sum "${structural}"
            sha256sum "${phi}"
          done
