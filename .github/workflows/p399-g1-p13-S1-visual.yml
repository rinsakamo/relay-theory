name: P399 G1 P13 exact publisher S1 visual model maths probe
on:
  pull_request:
    paths:
      - "research/paper2/p399/g1/p13/p13_original_s1_math_visual_probe.py"
      - ".github/workflows/p399-g1-p13-S1-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p13-visual-original-s1:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'pymupdf==1.26.5' 'pillow==11.3.0'
      - run: python research/paper2/p399/g1/p13/p13_original_s1_math_visual_probe.py
