name: P399 G2 predeclared first backups publisher-origin PRE_A-only
on:
  push:
    branches:
      - "paper2/p399-g2-outcome-blind-main40-working-20261004"
    paths:
      - "research/paper2/p399/g2/g2_v6_first_backup_primary_originals.py"
      - ".github/workflows/p399-g2-v6-primary-backup-sources.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-first-priority-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - run: python research/paper2/p399/g2/g2_v6_first_backup_primary_originals.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-v6-first-standby-original-source-provenance-${{ github.run_id }}
          path: g2-v6-backup/predeclared_first_standby_source_metadata.json
          retention-days: 14
          if-no-files-found: warn
