name: P399 G2-D INT13 final-edition publisher witness
on:
  push:
    branches:
      - paper2/p399-g2d-int13-edition-witness-20261005
    paths:
      - research/paper2/p399/g2/int_g2d/int13_edition_firstparty_probe.py
      - .github/workflows/p399-g2d-int13-firstparty-edition-witness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  int13-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pypdf==6.1.1 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Bounded direct first-party and Chromium if original still proof or blocked
        run: python research/paper2/p399/g2/int_g2d/int13_edition_firstparty_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2d-int13-edition-witness-${{ github.run_id }}
          path: int13-edition-witness/receipts.json
          if-no-files-found: warn
          retention-days: 14
