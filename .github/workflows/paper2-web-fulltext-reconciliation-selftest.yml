name: paper2-web-fulltext-reconciliation-selftest

on:
  pull_request:
    paths:
      - "research/paper2/designed_source_web_fulltext_manifest_v1.json"
      - "research/paper2/designed_source_web_fulltext_manifest_v1.sha256"
      - "scripts/paper2_designed_source_web_fulltext_validate.py"
      - ".github/workflows/paper2-web-fulltext-reconciliation-selftest.yml"
  push:
    branches: [main]
    paths:
      - "research/paper2/designed_source_web_fulltext_manifest_v1.json"
      - "research/paper2/designed_source_web_fulltext_manifest_v1.sha256"
      - "scripts/paper2_designed_source_web_fulltext_validate.py"
      - ".github/workflows/paper2-web-fulltext-reconciliation-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse frozen web-fulltext manifest
        run: python -m json.tool research/paper2/designed_source_web_fulltext_manifest_v1.json >/dev/null
      - name: Compile reconciliation validator
        run: python -m py_compile scripts/paper2_designed_source_web_fulltext_validate.py
      - name: Validate frozen reconciliation manifest
        run: python scripts/paper2_designed_source_web_fulltext_validate.py
      - name: Run destructive reconciliation self-test
        run: python scripts/paper2_designed_source_web_fulltext_validate.py --self-test
      - name: Verify immutable reconciliation digest
        run: sha256sum -c research/paper2/designed_source_web_fulltext_manifest_v1.sha256
