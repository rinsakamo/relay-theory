name: P399 G1 W3 P15 real independent publisher exact after-E
on:
  push:
    branches:
      - paper2/p399-g1-w3-mem-prd-family-20261004
    paths:
      - .github/workflows/p399-g1-W3-P15-afterE-independent-publisher.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  P15_independent_real_afterE_original_publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript
      - run: python -m pip install --quiet pypdf pymupdf
      - name: Verify five exact official original sources and six historic frozen science commits
        run: python research/paper2/p399/g1/parallel/W3/P15_independent_original_afterE_source_history_audit.py
      - name: Retain exact original post-E publisher/source and stage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W3-P15-REAL-publisher-after-E-${{ github.run_id }}
          path: ${{ runner.temp }}/W3_P15_real_afterE_original_publisher_audit_receipt.json
          if-no-files-found: warn
          retention-days: 30
