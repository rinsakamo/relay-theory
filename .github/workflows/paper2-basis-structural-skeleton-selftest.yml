name: paper2-basis-structural-skeleton-selftest

on:
  pull_request:
    paths:
      - "research/paper2/archetype_claim_forgetting_contract_v1.json"
      - "research/paper2/basis_structural_skeleton_v1.schema.json"
      - "scripts/paper2_basis_structural_skeleton.py"
      - ".github/workflows/paper2-basis-structural-skeleton-selftest.yml"
      - "scripts/paper2_phi_compare.py"
      - "research/paper2/phi_object_v1.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run #293 U_claim destructive fixtures
        run: python scripts/paper2_basis_structural_skeleton.py --self-test
