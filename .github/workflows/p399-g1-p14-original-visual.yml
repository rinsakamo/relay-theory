name: P399 G1 P14 source visual math original main and S2 S3 S4 S5
on:
  pull_request:
    paths:
      - "research/paper2/p399/g1/p14/p14_main_and_S2_S5_visual_critical_math_probe.py"
      - ".github/workflows/p399-g1-p14-original-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'pymupdf==1.26.5' 'pillow==11.3.0'
      - run: python research/paper2/p399/g1/p14/p14_main_and_S2_S5_visual_critical_math_probe.py
