name: W8S official supplement acquisition

on:
  push:
    branches:
      - paper2/p399-g4-w8s-source-blockers-20261005
    paths:
      - research/paper2/p399/g4/w8s_source_blockers/W8S_ACQUIRE_TRIGGER
  pull_request:
    types: [opened, synchronize]
    branches:
      - paper2/p399-g4-w7-six-lane-integration-20261005
    paths:
      - research/paper2/p399/g4/w8s_source_blockers/W8S_ACQUIRE_TRIGGER
      - research/paper2/p399/g4/w8s_source_blockers/acquire_official_supplements.py
      - .github/workflows/w8s_official_supplement_acquire.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact W8-S branch
        uses: actions/checkout@v4
        with:
          ref: paper2/p399-g4-w8s-source-blockers-20261005
          fetch-depth: 0
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Acquire official PLOS supplements
        run: python research/paper2/p399/g4/w8s_source_blockers/acquire_official_supplements.py
      - name: Commit frozen raw bytes and pre-audit receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/paper2/p399/g4/w8s_source_blockers/raw \
                  research/paper2/p399/g4/w8s_source_blockers/extracted_text_non_authority \
                  research/paper2/p399/g4/w8s_source_blockers/W8S_ACQUISITION_RECEIPTS_PREAUDIT_v1.json
          if git diff --cached --quiet; then
            echo "No acquisition outputs changed."
          else
            git commit -m "P399 W8-S freeze official supplement raw bytes [skip ci]"
            git push origin HEAD:paper2/p399-g4-w8s-source-blockers-20261005
          fi
