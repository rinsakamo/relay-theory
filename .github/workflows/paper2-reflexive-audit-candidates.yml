name: paper2-reflexive-audit-candidates

on:
  push:
    branches:
      - paper2-reflexive-audit-384
    paths:
      - "paper/validation/jgps-major-revision/reflexive-audit-v1/**"
      - "scripts/paper2_reflexive_audit_candidates_validate.py"
      - ".github/workflows/paper2-reflexive-audit-candidates.yml"
  pull_request:
    paths:
      - "paper/validation/jgps-major-revision/reflexive-audit-v1/**"
      - "scripts/paper2_reflexive_audit_candidates_validate.py"
      - ".github/workflows/paper2-reflexive-audit-candidates.yml"

permissions:
  contents: read

jobs:
  pre-review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile scripts/paper2_reflexive_audit_candidates_validate.py
      - name: Validate twice and compare
        run: |
          python scripts/paper2_reflexive_audit_candidates_validate.py --output /tmp/rfx-a.json
          python scripts/paper2_reflexive_audit_candidates_validate.py --output /tmp/rfx-b.json
          cmp /tmp/rfx-a.json /tmp/rfx-b.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: paper2-reflexive-audit-pre-review-receipt
          path: /tmp/rfx-a.json
