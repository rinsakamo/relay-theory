name: RelayTheory Lean CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: relay-theory-lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify and verify validation target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              VALIDATION_MODE="exact-head"
              EXPECTED_SHA="$PR_HEAD_SHA"
              ;;
            push)
              VALIDATION_MODE="merge-head"
              EXPECTED_SHA="$EVENT_SHA"
              test "$EVENT_REF" = "refs/heads/main"
              ;;
            workflow_dispatch)
              VALIDATION_MODE="manual-head"
              EXPECTED_SHA="$EVENT_SHA"
              ;;
            *)
              echo "Unsupported validation event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          {
            echo "### RelayTheory formal validation"
            echo
            printf -- '- Mode: `%s`\n' "$VALIDATION_MODE"
            printf -- '- Event: `%s`\n' "$EVENT_NAME"
            printf -- '- Ref: `%s`\n' "$EVENT_REF"
            printf -- '- Expected SHA: `%s`\n' "$EXPECTED_SHA"
            printf -- '- Validated SHA: `%s`\n' "$ACTUAL_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "validation_mode=$VALIDATION_MODE"
          echo "validated_sha=$ACTUAL_SHA"

      - name: Audit banned proof shortcuts
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.lean' -nE '(^|[^[:alnum:]_])(sorry|admit|native_decide|axiom)([^[:alnum:]_]|$)' formal/relay_theory; then
            echo "Banned Lean proof shortcut or project-local axiom declaration found." >&2
            exit 1
          fi

      - name: Install pinned elan and declared Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          ELAN_VERSION="v4.2.4"
          ELAN_SHA256="42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63"
          ELAN_ARCHIVE="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          ELAN_DIR="$RUNNER_TEMP/elan-bootstrap"
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$ELAN_ARCHIVE"
          echo "${ELAN_SHA256}  ${ELAN_ARCHIVE}" | sha256sum --check --strict
          mkdir -p "$ELAN_DIR"
          tar -xzf "$ELAN_ARCHIVE" -C "$ELAN_DIR"
          TOOLCHAIN="$(tr -d '\r\n' < formal/relay_theory/lean-toolchain)"
          "$ELAN_DIR/elan-init" -y --no-modify-path --default-toolchain none
          for attempt in 1 2 3; do
            if "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Lean toolchain download failed after 3 attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          "$HOME/.elan/bin/elan" default "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd formal/relay_theory
          lean --version
          lake --version
          lean --version | grep -F "version 4.33.1"

      - name: Build formal core
        shell: bash
        run: |
          set -euo pipefail
          cd formal/relay_theory
          lake build

      - name: Audit and build anonymous Paper 1 Lean supplement
        shell: bash
        run: |
          set -euo pipefail
          SUPP="paper/venues/philosophy-of-science/anonymous-lean-supplement"
          if grep -R -nEi 'rinsakamo|relay[- ]?theory|github\.com' "$SUPP"; then
            echo "Anonymous Lean supplement contains repository/author identity leakage." >&2
            exit 1
          fi
          if grep -R --include='*.lean' -nE '(^|[^[:alnum:]_])(sorry|admit|native_decide|axiom)([^[:alnum:]_]|$)' "$SUPP"; then
            echo "Anonymous Lean supplement contains a banned proof shortcut." >&2
            exit 1
          fi
          test "$(tr -d '\r\n' < "$SUPP/lean-toolchain")" = "$(tr -d '\r\n' < formal/relay_theory/lean-toolchain)"
          (
            cd "$SUPP"
            lake build
          )

      - name: Independently kernel-check compiled modules
        shell: bash
        run: |
          set -euo pipefail
          cd formal/relay_theory
          lake env leanchecker RelayTheory

      - name: Audit theorem axioms with pinned axiom-audit
        shell: bash
        run: |
          set -euo pipefail
          AXIOM_AUDIT_REF="v0.1.2"
          AXIOM_AUDIT_SHA="46024e005996495c65ef609368e11ab39c4222e3"
          WORKDIR="$(mktemp -d "$RUNNER_TEMP/axiom-audit.XXXXXX")"
          trap 'rm -rf "$WORKDIR"' EXIT

          git clone --depth 1 --branch "$AXIOM_AUDIT_REF" \
            https://github.com/leanprover-community/axiom-audit.git \
            "$WORKDIR/axiom-audit"
          GOT_SHA="$(git -C "$WORKDIR/axiom-audit" rev-parse HEAD)"
          test "$GOT_SHA" = "$AXIOM_AUDIT_SHA"

          cp formal/relay_theory/lean-toolchain "$WORKDIR/axiom-audit/lean-toolchain"
          (
            cd "$WORKDIR/axiom-audit"
            lake build
          )
          (
            cd formal/relay_theory
            lake env "$WORKDIR/axiom-audit/.lake/build/bin/axiom-audit" \
              --root RelayTheory \
              --allow "propext,Classical.choice,Quot.sound"
          )

      - name: Upload anonymous Paper 1 Lean supplement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-1-anonymous-lean-supplement
          path: paper/venues/philosophy-of-science/anonymous-lean-supplement/
          if-no-files-found: error
          retention-days: 14
