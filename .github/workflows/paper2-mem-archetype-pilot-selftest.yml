name: paper2-mem-archetype-pilot-selftest

on:
  pull_request:
    paths:
      - "scripts/paper2_archetype_mem_pilot.py"
      - ".github/workflows/paper2-mem-archetype-pilot-selftest.yml"
      - "scripts/paper2_basis_structural_skeleton.py"
      - "scripts/paper2_basis_subobject_forgetting.py"
      - "research/paper2/chatgpt_reference_claimir_v1/MEM*.json"
      - "research/paper2/reference_structural_adjudication_v1/MEM*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determinism / integration self-test
        run: python scripts/paper2_archetype_mem_pilot.py --self-test
      - name: Emit MEM pilot report
        run: python scripts/paper2_archetype_mem_pilot.py --emit-report
