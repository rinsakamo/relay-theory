name: P399 MAIN M14 licensed-inference and cross-model-replay guards

on:
  pull_request:
    paths:
      - 'research/paper2/p399/main/integration/M14/**'
      - 'scripts/paper2_m14_*.py'
      - 'paper/venues/jgps/**'
      - '.github/workflows/p399-main-m14-inference-warrant-replication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m14-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run M14 authority and replay guards
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python scripts/paper2_m14_inference_warrant_replication_audit.py
          python scripts/paper2_phi_compare.py --self-test
          ! grep -F '\paragraph{' paper/venues/jgps/main.tex
          ! grep -Fi 'construct-label-neutral' paper/venues/jgps/main.tex

      - name: Package public cross-model replay inputs
        run: |
          set -euo pipefail
          rm -rf m14-cross-model-replay
          mkdir -p m14-cross-model-replay
          cp research/paper2/p399/main/integration/M14/M14_CROSS_MODEL_REPLICATION_PROTOCOL_v1.json m14-cross-model-replay/
          cp research/paper2/p399/main/integration/M14/M14_CROSS_MODEL_INPUT_MANIFEST_v1.json m14-cross-model-replay/
          cp research/paper2/p399/main/integration/M14/M14_CROSS_MODEL_BLANK_RECORD_v1.json m14-cross-model-replay/
          cp research/paper2/p399/main/integration/M14/M14_CROSS_MODEL_COMPARISON_RULES_v1.json m14-cross-model-replay/
          cp research/paper2/p399/main/integration/M14/M14_CROSS_MODEL_PROMPT_v1.md m14-cross-model-replay/
          cp research/paper2/p399/main/integration/M14/M14_CROSS_MODEL_REPLAY_README_FROZEN_v1.md m14-cross-model-replay/README.md
          printf '%s\n' \
            'This is the blind pre-result replay packet.' \
            'No replay output or comparison result is included in this artifact.' \
            'Human inter-rater validation remains unperformed.' \
            'Freeze all ten model outputs before opening retained references.' \
            > m14-cross-model-replay/STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: paper-2-m14-public-cross-model-replay-packet
          path: m14-cross-model-replay
          if-no-files-found: error
          retention-days: 30

      - name: Package post-freeze replay comparison authority
        run: |
          set -euo pipefail
          rm -rf m14-replay-comparison
          mkdir -p m14-replay-comparison
          cp research/paper2/p399/main/integration/M14/M14_ASTRA_UI_PROVENANCE_SUPPLEMENT_v1.json m14-replay-comparison/
          cp research/paper2/p399/main/integration/M14/M14_REPLAY_COMPARISON_RESULTS_v1.json m14-replay-comparison/
          cp research/paper2/p399/main/integration/M14/M14_REPLAY_COMPARISON_RECEIPT_v1.json m14-replay-comparison/
          cp research/paper2/p399/main/integration/M14/M14_REPLAY_COMPARISON_REPORT_v1.md m14-replay-comparison/
          cp research/paper2/p399/main/integration/M14/README.md m14-replay-comparison/
          printf '%s\n' \
            'Post-freeze comparison authority.' \
            'This artifact MUST NOT be supplied to a blinded v1 replay.' \
            'Procedural auditability is established; inter-rater reliability remains unmeasured.' \
            > m14-replay-comparison/STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: paper-2-m14-postfreeze-replay-comparison
          path: m14-replay-comparison
          if-no-files-found: error
          retention-days: 30

      - name: Install strict LaTeX build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra texlive-pictures poppler-utils

      - name: Strict build JGPS manuscript
        run: |
          set -euo pipefail
          cd paper/venues/jgps
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -En 'LaTeX Warning:|Package .* Warning:|Overfull \\hbox|Citation .* undefined|Reference .* undefined' main.log; then exit 1; fi
          pdftotext main.pdf main.txt
          tr '\n' ' ' < main.txt | tr -s '[:space:]' ' ' > main.flat.txt
          if test -f ../../../research/paper2/p399/main/integration/M19/M19_SPEC_v1.json; then
            grep -F 'Discrimination Requirement' main.flat.txt
            grep -F 'Structural invariance as a live target' main.flat.txt
            grep -F 'Botvinick' main.flat.txt
          elif test -f ../../../research/paper2/p399/main/integration/M17/M17_SPEC_v1.json; then
            grep -F 'epistemically licensed only if' main.flat.txt
            grep -F 'Structural invariance as a live target' main.flat.txt
            grep -F 'Botvinick' main.flat.txt
          else
            grep -F 'which invariance can individuate' main.flat.txt
            grep -F 'ATT03' main.flat.txt
          fi
          grep -F 'inter-rater reliability remains unmeasured' main.flat.txt
          PAGES="$(pdfinfo main.pdf | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')"
          echo "JGPS manuscript pages: $PAGES" | tee main-page-count.txt
          test "$PAGES" -le 22

      - name: Strict build supplementary methods
        run: |
          set -euo pipefail
          cd paper/venues/jgps
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          test -s supplement.pdf
          if grep -En 'LaTeX Warning:|Package .* Warning:|Overfull \\hbox|Reference .* undefined' supplement.log; then exit 1; fi
          pdftotext supplement.pdf supplement.txt
          tr '\n' ' ' < supplement.txt | tr -s '[:space:]' ' ' > supplement.flat.txt
          if test -f ../../../research/paper2/p399/main/integration/M19/M19_SPEC_v1.json; then
            grep -F 'Named-model procedural robustness diagnostics' supplement.flat.txt
          elif test -f ../../../research/paper2/p399/main/integration/M17/M17_SPEC_v1.json; then
            grep -F 'Named-model reconstruction validation' supplement.flat.txt
          else
            grep -F 'Public cross-model source reconstruction replay' supplement.flat.txt
          fi
          grep -F 'inter-rater reliability remains unmeasured' supplement.flat.txt
          PAGES="$(pdfinfo supplement.pdf | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')"
          echo "Supplement pages: $PAGES" | tee supplement-page-count.txt

      - uses: actions/upload-artifact@v4
        with:
          name: paper-2-m14-jgps-manuscript-and-supplement
          path: |
            paper/venues/jgps/main.pdf
            paper/venues/jgps/supplement.pdf
            paper/venues/jgps/main-page-count.txt
            paper/venues/jgps/supplement-page-count.txt
          if-no-files-found: error
          retention-days: 30
