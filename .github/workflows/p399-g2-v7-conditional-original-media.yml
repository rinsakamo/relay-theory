name: P399 G2 v7 conditional firstparty PLOS supplement and second PRD standby
on:
  push:
    branches:
      - "paper2/p399-g2-outcome-blind-main40-working-20261004"
    paths:
      - "research/paper2/p399/g2/g2_v7_conditional_source_scope_preA.py"
      - ".github/workflows/p399-g2-v7-conditional-original-media.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-source-PRE_A:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - run: python research/paper2/p399/g2/g2_v7_conditional_source_scope_preA.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G2-V7-conditional-source-only-${{ github.run_id }}
          path: g2-v7/firstparty_conditional_media.json
          retention-days: 14
