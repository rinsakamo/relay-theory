name: P399 G1 publisher first-level DOI citation TRIAGE only
on:
  pull_request:
    paths:
      - "research/paper2/p399/g1/first_level_publisher_source_doi_crosslinks.py"
      - ".github/workflows/p399-g1-publisher-crossrefs.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g1-publisher-doi-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.5
      - run: python research/paper2/p399/g1/first_level_publisher_source_doi_crosslinks.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p399-g1-original-publisher-cross-doi-triage-${{ github.run_id }}
          path: g1-crossrefs/crossrefs.json
          if-no-files-found: warn
          retention-days: 14
