          python -m json.tool /tmp/PRD06.structural.json >/dev/null
          python -m json.tool /tmp/PRD06.phi.json >/dev/null
          echo "PRD06 decision=$(python -c 'import json; print(json.load(open("research/paper2/reference_structural_adjudication_v1/PRD06.json"))["decision"]["status"])')"
          sha256sum /tmp/PRD06.structural.json
          sha256sum /tmp/PRD06.phi.json

      - name: Assert lane boundary
        run: |
          set -euo pipefail
          echo "pairwise Phi = NOT RUN"
          echo "atlas = NOT RUN"
          echo "architecture tuning = NONE"
