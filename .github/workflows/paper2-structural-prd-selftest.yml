name: paper2-structural-prd-selftest

on:
  pull_request:
    branches: [paper2-reference-structural-adjudication-v1-267]
    paths:
      - "research/paper2/reference_structural_adjudication_v1/PRD*.json"
      - "research/paper2/chatgpt_reference_claimir_v1/PRD*.json"
      - "scripts/paper2_reference_structural_adjudication.py"
      - "scripts/paper2_phi_compare.py"
      - "scripts/paper2_structural_signature_*.py"
      - "research/paper2/claim_ir_v1.*"
      - "research/paper2/structural_signature_v1.*"
      - ".github/workflows/paper2-structural-prd-selftest.yml"
  push:
    branches: [paper2-structural-prd-267]
    paths:
      - "research/paper2/reference_structural_adjudication_v1/PRD*.json"
      - ".github/workflows/paper2-structural-prd-selftest.yml"

permissions:
  contents: read

jobs:
  prd-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile frozen checkers
        run: |
          python -m py_compile scripts/paper2_reference_structural_adjudication.py
          python -m py_compile scripts/paper2_phi_compare.py
      - name: Frozen protocol self-test
        run: python scripts/paper2_reference_structural_adjudication.py --self-test
      - name: PRD01 compile and Phi projection
        run: |
          set -euo pipefail
          python scripts/paper2_reference_structural_adjudication.py \
            --claim-ir research/paper2/chatgpt_reference_claimir_v1/PRD01.json \
            --adjudication research/paper2/reference_structural_adjudication_v1/PRD01.json \
            --output /tmp/PRD01.structural.json
          python scripts/paper2_phi_compare.py \
            --project /tmp/PRD01.structural.json \
            > /tmp/PRD01.phi.json
          python -m json.tool /tmp/PRD01.structural.json >/dev/null
          python -m json.tool /tmp/PRD01.phi.json >/dev/null
          echo "PRD01 decision=$(python -c 'import json; print(json.load(open("research/paper2/reference_structural_adjudication_v1/PRD01.json"))["decision"]["status"])')"
          sha256sum /tmp/PRD01.structural.json
          sha256sum /tmp/PRD01.phi.json
      - name: PRD02 compile and Phi projection
        run: |
          set -euo pipefail
          python scripts/paper2_reference_structural_adjudication.py \
            --claim-ir research/paper2/chatgpt_reference_claimir_v1/PRD02.json \
            --adjudication research/paper2/reference_structural_adjudication_v1/PRD02.json \
            --output /tmp/PRD02.structural.json
          python scripts/paper2_phi_compare.py \
            --project /tmp/PRD02.structural.json \
            > /tmp/PRD02.phi.json
          python -m json.tool /tmp/PRD02.structural.json >/dev/null
          python -m json.tool /tmp/PRD02.phi.json >/dev/null
          echo "PRD02 decision=$(python -c 'import json; print(json.load(open("research/paper2/reference_structural_adjudication_v1/PRD02.json"))["decision"]["status"])')"
          sha256sum /tmp/PRD02.structural.json
          sha256sum /tmp/PRD02.phi.json
      - name: PRD03 compile and Phi projection
        run: |
          set -euo pipefail
          python scripts/paper2_reference_structural_adjudication.py \
