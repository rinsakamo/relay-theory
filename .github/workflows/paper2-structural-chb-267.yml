name: paper2-structural-chb-267-selftest

on:
  push:
    branches:
      - paper2-structural-chb-267
    paths:
      - "research/paper2/reference_structural_adjudication_v1/CH02.json"
      - "research/paper2/reference_structural_adjudication_v1/CH04.json"
      - "research/paper2/reference_structural_adjudication_v1/CH06.json"
      - "research/paper2/reference_structural_adjudication_v1/CH08.json"
      - "research/paper2/reference_structural_adjudication_v1/CH10.json"
      - "research/paper2/reference_structural_adjudication_v1/CH12.json"
      - ".github/workflows/paper2-structural-chb-267.yml"
  pull_request:
    branches:
      - paper2-reference-structural-adjudication-v1-267
    paths:
      - "research/paper2/reference_structural_adjudication_v1/CH02.json"
      - "research/paper2/reference_structural_adjudication_v1/CH04.json"
      - "research/paper2/reference_structural_adjudication_v1/CH06.json"
      - "research/paper2/reference_structural_adjudication_v1/CH08.json"
      - "research/paper2/reference_structural_adjudication_v1/CH10.json"
      - "research/paper2/reference_structural_adjudication_v1/CH12.json"
      - ".github/workflows/paper2-structural-chb-267.yml"

permissions:
  contents: read

jobs:
  challenge-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile frozen checkers
        run: |
          python -m py_compile scripts/paper2_reference_structural_adjudication.py
          python -m py_compile scripts/paper2_phi_compare.py

      - name: Run frozen adjudication protocol self-test
        run: python scripts/paper2_reference_structural_adjudication.py --self-test

      - name: Detect Challenge B adjudication changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          claims=""
          for c in CH02 CH04 CH06 CH08 CH10 CH12; do
            p="research/paper2/reference_structural_adjudication_v1/$c.json"
            if grep -qx "$p" <<<"$changed"; then
              claims="$claims $c"
            fi
          done
          echo "claims=$claims" >> "$GITHUB_OUTPUT"
          echo "Changed Challenge B claims:$claims"

      - name: Validate changed Challenge B claim(s)
        if: steps.changed.outputs.claims != ''
        shell: bash
        run: |
          set -euo pipefail
          for c in ${{ steps.changed.outputs.claims }}; do
            python scripts/paper2_reference_structural_adjudication.py \
              --claim-ir research/paper2/chatgpt_reference_claimir_v1/$c.json \
              --adjudication research/paper2/reference_structural_adjudication_v1/$c.json \
              --output /tmp/$c.structural.json

            python scripts/paper2_phi_compare.py \
              --project /tmp/$c.structural.json \
              > /tmp/$c.phi.json

            python -m json.tool /tmp/$c.structural.json >/dev/null
            python -m json.tool /tmp/$c.phi.json >/dev/null

            structural_sha="$(sha256sum /tmp/$c.structural.json | awk '{print $1}')"
            phi_sha="$(sha256sum /tmp/$c.phi.json | awk '{print $1}')"
            echo "$c validation=PASS structural_sha256=$structural_sha phi_sha256=$phi_sha"
          done

      - name: Final six-claim individual replay
        if: contains(steps.changed.outputs.claims, 'CH12')
        shell: bash
        run: |
          set -euo pipefail
          for c in CH02 CH04 CH06 CH08 CH10 CH12; do
            python scripts/paper2_reference_structural_adjudication.py \
              --claim-ir research/paper2/chatgpt_reference_claimir_v1/$c.json \
              --adjudication research/paper2/reference_structural_adjudication_v1/$c.json \
              --output /tmp/$c.structural.json

            python scripts/paper2_phi_compare.py \
              --project /tmp/$c.structural.json \
              > /tmp/$c.phi.json

            python -m json.tool /tmp/$c.structural.json >/dev/null
            python -m json.tool /tmp/$c.phi.json >/dev/null

            structural_sha="$(sha256sum /tmp/$c.structural.json | awk '{print $1}')"
            phi_sha="$(sha256sum /tmp/$c.phi.json | awk '{print $1}')"
            echo "FINAL $c validation=PASS structural_sha256=$structural_sha phi_sha256=$phi_sha"
          done
