name: paper2-ahv8-assertion-carrier

on:
  push:
    branches:
      - paper2-ahv8-assertion-carrier-382
    paths:
      - "paper/validation/jgps-major-revision/ahv8-assertion-carrier-*"
      - "paper/validation/jgps-major-revision/ahv8-claimir-human-reviewed-v1/**"
      - "paper/validation/jgps-major-revision/l-claim-assertion-carrier-schema-v1.json"
      - "scripts/paper2_ahv8_assertion_carrier_validate.py"
      - ".github/workflows/paper2-ahv8-assertion-carrier.yml"
  pull_request:
    paths:
      - "paper/validation/jgps-major-revision/ahv8-assertion-carrier-*"
      - "paper/validation/jgps-major-revision/ahv8-claimir-human-reviewed-v1/**"
      - "paper/validation/jgps-major-revision/l-claim-assertion-carrier-schema-v1.json"
      - "scripts/paper2_ahv8_assertion_carrier_validate.py"
      - ".github/workflows/paper2-ahv8-assertion-carrier.yml"

permissions:
  contents: read

jobs:
  ahv8-assertion-carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/paper2_ahv8_assertion_carrier_validate.py
      - name: Validate twice and compare
        run: |
          python scripts/paper2_ahv8_assertion_carrier_validate.py --output /tmp/ahv-carrier-a.json
          python scripts/paper2_ahv8_assertion_carrier_validate.py --output /tmp/ahv-carrier-b.json
          cmp /tmp/ahv-carrier-a.json /tmp/ahv-carrier-b.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: paper2-ahv8-assertion-carrier-receipt
          path: /tmp/ahv-carrier-a.json
