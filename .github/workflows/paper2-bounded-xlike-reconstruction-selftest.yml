name: paper2-bounded-xlike-reconstruction-selftest

on:
  pull_request:
    paths:
      - "scripts/paper2_bounded_xlike_reconstruction.py"
      - "research/paper2/bounded_xlike_reconstruction_v1.json"
      - ".github/workflows/paper2-bounded-xlike-reconstruction-selftest.yml"
      - "research/paper2/global_archetype_reconstruction_v1.json"
      - "research/paper2/reference_global_phi_freeze_v1.json"
      - "research/paper2/reference_phi_projection_freeze_v1.json"
      - "research/paper2/archetype_claim_forgetting_contract_v1.json"
      - "research/paper2/basis_subobject_forgetting_contract_v1.json"
      - "research/paper2/chatgpt_reference_claimir_v1/*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xlike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run terminal A1-A8 audit
        run: python scripts/paper2_bounded_xlike_reconstruction.py --self-test
      - name: Regenerate bounded XLike report
        run: python scripts/paper2_bounded_xlike_reconstruction.py --emit-report --output /tmp/bounded_xlike_reconstruction_v1.json
      - name: Verify frozen bounded XLike report
        run: cmp /tmp/bounded_xlike_reconstruction_v1.json research/paper2/bounded_xlike_reconstruction_v1.json
