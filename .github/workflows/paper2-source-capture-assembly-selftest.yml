name: paper2-source-capture-assembly-selftest

on:
  pull_request:
    paths:
      - "research/paper2/eligibility_source_capture_v1.schema.json"
      - "research/paper2/eligibility_source_capture_assembly_v1.json"
      - "scripts/paper2_eligibility_source_capture_assemble.py"
      - "research/paper2/eligibility_source_bundle_v1.schema.json"
      - "scripts/paper2_eligibility_adjudication_validate.py"
      - "research/paper2/eligibility_adjudication_v1.json"
      - ".github/workflows/paper2-source-capture-assembly-selftest.yml"
  push:
    branches:
      - main
    paths:
      - "research/paper2/eligibility_source_capture_v1.schema.json"
      - "research/paper2/eligibility_source_capture_assembly_v1.json"
      - "scripts/paper2_eligibility_source_capture_assemble.py"
      - "research/paper2/eligibility_source_bundle_v1.schema.json"
      - "scripts/paper2_eligibility_adjudication_validate.py"
      - "research/paper2/eligibility_adjudication_v1.json"
      - ".github/workflows/paper2-source-capture-assembly-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source-capture assembler
        run: python -m py_compile scripts/paper2_eligibility_source_capture_assemble.py
      - name: Re-run frozen eligibility adjudication self-test
        run: python scripts/paper2_eligibility_adjudication_validate.py --self-test
      - name: Run source-capture destructive self-test
        run: python scripts/paper2_eligibility_source_capture_assemble.py --self-test
