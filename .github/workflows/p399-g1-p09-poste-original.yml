name: P399 G1 P09 independent original post-E bounded scientific provenance
on:
  pull_request:
    paths:
      - "research/paper2/p399/g1/p09/p09_post_e_original_source_and_history_audit.py"
      - ".github/workflows/p399-g1-p09-poste-original.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p09-original-source-after-E:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check 'pypdf==6.1.1'
      - run: python research/paper2/p399/g1/p09/p09_post_e_original_source_and_history_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-p09-poste-metadata-${{ github.run_id }}
          path: g1-p09-poste/exact-raw-publisher-poste.json
          retention-days: 14
          if-no-files-found: warn
