      - "paper2/p399-g2-prd-c-independent-20261004"
    paths:
      - "research/paper2/p399/g2/parallel/prd_c/PRD_C_BOUNDED_VERDICTS_AND_OWNER_ESCALATIONS_v1.json"
      - "research/paper2/p399/g2/parallel/prd_c/prd_c_safeguard_check.py"
      - ".github/workflows/p399-g2-prd-c-verdict-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prd-c-negative-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
