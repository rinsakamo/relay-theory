name: P399 G1 W3 P18 independently exact original publisher after-E
on:
  push:
    branches:
      - paper2/p399-g1-w3-mem-prd-family-20261004
    paths:
      - .github/workflows/p399-g1-W3-P18-afterE-exact-publisher.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  P18_independent_original_afterE:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pypdf pillow pymupdf
      - name: Re-acquire independently exact original final publisher PDF S5 S6 and parameter table then verify all six frozen Git introductions
        run: python research/paper2/p399/g1/parallel/W3/P18_independent_postE_exact_original_source_history_audit.py
      - name: Retain exact source and frozen source-native evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W3-P18-original-after-E-${{ github.run_id }}
          path: ${{ runner.temp }}/W3_P18_independent_afterE_original_publisher_receipt.json
          if-no-files-found: warn
          retention-days: 30
