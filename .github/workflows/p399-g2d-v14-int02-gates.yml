name: P399 G2-D v14 INT02 exact science source boundaries and 17 destructive guards
on:
  pull_request:
    paths:
      - "research/paper2/p399/g2/int_g2d/G2D_V14_*"
      - "research/paper2/p399/g2/int_g2d/test_v14_int02_source_and_false_global_promotions.py"
      - ".github/workflows/p399-g2d-v14-int02-gates.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-original-versus-global-science:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify official original science receipt bytes + reject seventeen invalid promotions
        run: python3 research/paper2/p399/g2/int_g2d/test_v14_int02_source_and_false_global_promotions.py
