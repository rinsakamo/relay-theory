name: paper2-llama-cpp-owned-transaction-selftest

on:
  pull_request:
    paths:
      - "scripts/paper2_extraction_llama_cpp_transaction.py"
      - "scripts/paper2_extraction_openai_runner.py"
      - "scripts/paper2_extraction_bundle_prepare.py"
      - "scripts/paper2_extraction_procedure_validate.py"
      - "scripts/paper2_extraction_receipt_validate.py"
      - "scripts/paper2_extraction_assemble_compare.py"
      - "scripts/paper2_claim_ir_validate.py"
      - "scripts/paper2_claim_ir_compare.py"
      - "research/paper2/extraction_run_package_v1.json"
      - "research/paper2/extraction_prompt_v1.md"
      - "research/paper2/extraction_provenance_v1.json"
      - ".github/workflows/paper2-llama-cpp-owned-transaction-selftest.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/paper2_extraction_llama_cpp_transaction.py"
      - "scripts/paper2_extraction_openai_runner.py"
      - "scripts/paper2_extraction_bundle_prepare.py"
      - "scripts/paper2_extraction_procedure_validate.py"
      - "scripts/paper2_extraction_receipt_validate.py"
      - "scripts/paper2_extraction_assemble_compare.py"
      - "scripts/paper2_claim_ir_validate.py"
      - "scripts/paper2_claim_ir_compare.py"
      - "research/paper2/extraction_run_package_v1.json"
      - "research/paper2/extraction_prompt_v1.md"
      - "research/paper2/extraction_provenance_v1.json"
      - ".github/workflows/paper2-llama-cpp-owned-transaction-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile owned transaction tooling
        run: |
          python -m py_compile scripts/paper2_claim_ir_validate.py
          python -m py_compile scripts/paper2_claim_ir_compare.py
          python -m py_compile scripts/paper2_extraction_bundle_prepare.py
          python -m py_compile scripts/paper2_extraction_procedure_validate.py
          python -m py_compile scripts/paper2_extraction_receipt_validate.py
          python -m py_compile scripts/paper2_extraction_assemble_compare.py
          python -m py_compile scripts/paper2_extraction_openai_runner.py
          python -m py_compile scripts/paper2_extraction_llama_cpp_transaction.py
      - name: Revalidate generic OpenAI-compatible runner
        run: python scripts/paper2_extraction_openai_runner.py --self-test
      - name: Run transaction-owned fake llama.cpp end-to-end self-test
        run: python scripts/paper2_extraction_llama_cpp_transaction.py --self-test
