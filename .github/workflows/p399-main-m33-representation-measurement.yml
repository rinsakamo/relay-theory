name: P399 MAIN M33 Representation Measurement Boundary
on:
  pull_request:
    paths:
      - 'paper/venues/jgps/**'
      - 'research/paper2/p399/main/integration/M33/**'
      - 'scripts/paper2_m33_representation_measurement_audit.py'
      - '.github/workflows/p399-main-m33-representation-measurement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m33:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scientific source and inferential scope
        run: |
          set -euo pipefail
          python scripts/paper2_m33_representation_measurement_audit.py
          python scripts/paper2_m32_evidential_promotion_audit.py
          python scripts/paper2_m31_semantic_hub_application_audit.py
          python scripts/paper2_m30_provenance_identifiability_audit.py
          python scripts/paper2_m29_finite_pair_law_audit.py
      - name: Install journal PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra poppler-utils
      - name: Strict manuscript and supplement
        run: |
          set -euo pipefail
          cd paper/venues/jgps
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          pdflatex -interaction=nonstopmode -halt-on-error supplement.tex
          ! grep -E 'Overfull \\hbox|Undefined control sequence|Citation .* undefined|There were undefined references' main.log
          ! grep -E 'Overfull \\hbox|Undefined control sequence|There were undefined references' supplement.log
          test "$(pdfinfo main.pdf | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')" -le 22
      - uses: actions/upload-artifact@v4
        with:
          name: paper-2-m33-representation-measurement-pdfs
          path: |
            paper/venues/jgps/main.pdf
            paper/venues/jgps/supplement.pdf
          if-no-files-found: error
          retention-days: 30
