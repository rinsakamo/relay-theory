name: P399 MAIN M9C PDF export

on:
  push:
    branches:
      - paper2/p399-main-m9c-pdf-export-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact export head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify M9C scientific ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE="0366a51457d2d7d997ab0f4cd097fe8268359172"
          git merge-base --is-ancestor "$BASE" HEAD

      - name: Install LaTeX build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra texlive-pictures \
            poppler-utils

      - name: Build M9C manuscript PDF
        shell: bash
        run: |
          set -euo pipefail
          cd paper/venues/jgps
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -En 'LaTeX Warning:|Package .* Warning:|Overfull \\hbox|Citation .* undefined|Reference .* undefined' main.log; then exit 1; fi
          pdfinfo main.pdf | grep -F "Pages:"

      - name: Upload M9C manuscript PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-theory-paper2-jgps-m9c
          path: paper/venues/jgps/main.pdf
          if-no-files-found: error
          retention-days: 14
