name: P399 G1 P07 independent post-E original-source scoped audit
on:
  pull_request:
    paths:
      - "research/paper2/p399/g1/p07/**"
      - ".github/workflows/p399-g1-p07-poste-original.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p07-real-original-after-E:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check 'pypdf==6.1.1'
      - run: python research/paper2/p399/g1/p07/p07_post_e_independent_original_pdf_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-p07-poste-original-metadata-${{ github.run_id }}
          path: g1-p07-poste/source-post-e.json
          retention-days: 14
          if-no-files-found: warn
