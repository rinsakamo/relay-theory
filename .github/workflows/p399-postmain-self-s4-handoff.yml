name: P399 post-MAIN Self S4 handoff

on:
  push:
    branches:
      - paper2/p399-postmain-self-s4-handoff-20261006
  pull_request:
    paths:
      - 'research/paper2/p399/postmain/reintegration/R5/**'
      - '.github/workflows/p399-postmain-self-s4-handoff.yml'

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/paper2/p399/postmain/reintegration/R5/test_self_s4_handoff.py
