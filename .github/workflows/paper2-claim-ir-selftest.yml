name: paper2-claim-ir-selftest

on:
  pull_request:
    paths:
      - "research/paper2/claim_ir_v1.schema.json"
      - "research/paper2/claim_ir_v1.example.json"
      - "scripts/paper2_claim_ir_validate.py"
      - ".github/workflows/paper2-claim-ir-selftest.yml"
  push:
    branches:
      - main
    paths:
      - "research/paper2/claim_ir_v1.schema.json"
      - "research/paper2/claim_ir_v1.example.json"
      - "scripts/paper2_claim_ir_validate.py"
      - ".github/workflows/paper2-claim-ir-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m py_compile scripts/paper2_claim_ir_validate.py
      - name: Run adversarial deterministic self-test
        run: python scripts/paper2_claim_ir_validate.py --self-test
      - name: Validate example and emit blinded projection
        run: |
          python scripts/paper2_claim_ir_validate.py \
            --input research/paper2/claim_ir_v1.example.json \
            --blinded-output /tmp/paper2-blinded-claim-v1.json
          test -s /tmp/paper2-blinded-claim-v1.json
