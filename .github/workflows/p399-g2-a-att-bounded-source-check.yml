name: P399 G2-A ATT source receipts and destructive controls
on:
  push:
    branches:
      - "paper2/p399-g2-a-att-original-qualification-20261004"
    paths:
      - "research/paper2/p399/g2/att_a/**"
      - ".github/workflows/p399-g2-a-att-bounded-source-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  att-a-bounded-not-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restrict modifications to isolated ATT lane and this workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 69748673c80f421605f1c63607472903ac2ed68c HEAD > /tmp/att_delta.txt
          cat /tmp/att_delta.txt
          if grep -Ev '^(research/paper2/p399/g2/att_a/|.github/workflows/p399-g2-a-att-bounded-source-check.yml$)' /tmp/att_delta.txt; then
            echo "FORBIDDEN_NON_ATT_MODIFICATION"
            exit 1
          fi
      - name: Install immutable extraction and render dependency
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.4
      - name: Run strict source-ledger negatives
        run: python research/paper2/p399/g2/att_a/test_att_a_bounded_guards.py
      - name: Verify actual immutable v8/v8a Git blob ancestry and post-pixel native-science guard; emit per-file raw SHA256 ledger
        run: python research/paper2/p399/g2/att_a/att_a_verify_v2_and_sha.py
      - name: Confirm permanent SHA256 sidecar against actual checkout and immutable upstream v8/v8a
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, re, subprocess
          d=pathlib.Path("research/paper2/p399/g2/att_a")
          ledger=d/"ATT_A_FINAL_RAW_UTF8_SHA256_LEDGER_v1.txt"
          pinned="69748673c80f421605f1c63607472903ac2ed68c"
          upstream="research/paper2/p399/g2/"
          count=0
          for line in ledger.read_text().splitlines():
              m=re.fullmatch(r"([0-9a-f]{64})  ([^ ]+)",line)
              if not m: continue
              expected,name=m.groups()
              if name.startswith("ORIGINAL_"): continue
              if name.startswith("IMMUTABLE_BASE_"):
                  raw=subprocess.check_output(["git","show",pinned+":"+upstream+name.removeprefix("IMMUTABLE_BASE_")])
              else: raw=(d/name).read_bytes()
              got=hashlib.sha256(raw).hexdigest()
              assert got==expected,(name,expected,got)
              count+=1
          assert count==10,count
          print("PERMANENT_SHA_LEDGER 10/10 EXACT_RAW_MATCH")
          PY
      - name: Independently try both exact original publisher PDFs with 12s per attempt
        run: python research/paper2/p399/g2/att_a/att_a_independent_source_receipt.py --timeout 12 --out att-a-run
      - name: Explicit scope limitations in job summary
        shell: bash
        run: |
          echo 'Procedural guard PASS does not imply S3 equation pixel audit or ATT-B1 family clearance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect att-a-run/ATT_A_ACTUAL_RUNTIME_RECEIPT.json for independent raw first-party download success. Failure means browser manual fallback and HOLD.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G2-A-ATT-bounded-physical-receipt-${{ github.run_id }}
          path: att-a-run/
          retention-days: 14
