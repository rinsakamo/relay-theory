name: paper2-blf-archetype-reconstruction-selftest

on:
  push:
    branches:
      - paper2-archetype-blf-300
    paths:
      - "scripts/paper2_archetype_blf.py"
      - "research/paper2/blf_archetype_reconstruction_v1.json"
      - ".github/workflows/paper2-blf-archetype-reconstruction-selftest.yml"
      - "scripts/paper2_archetype_mem_pilot.py"
      - "scripts/paper2_basis_structural_skeleton.py"
      - "scripts/paper2_basis_subobject_forgetting.py"
      - "research/paper2/chatgpt_reference_claimir_v1/BLF*.json"
      - "research/paper2/reference_structural_adjudication_v1/BLF*.json"
  pull_request:
    paths:
      - "scripts/paper2_archetype_blf.py"
      - "research/paper2/blf_archetype_reconstruction_v1.json"
      - ".github/workflows/paper2-blf-archetype-reconstruction-selftest.yml"
      - "scripts/paper2_archetype_mem_pilot.py"
      - "scripts/paper2_basis_structural_skeleton.py"
      - "scripts/paper2_basis_subobject_forgetting.py"
      - "research/paper2/chatgpt_reference_claimir_v1/BLF*.json"
      - "research/paper2/reference_structural_adjudication_v1/BLF*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determinism / integration self-test
        run: python scripts/paper2_archetype_blf.py --self-test
      - name: Regenerate BLF lane report
        run: python scripts/paper2_archetype_blf.py --emit-report --output /tmp/blf_archetype_reconstruction_v1.json
      - name: Freeze bootstrap report or verify byte identity
        run: |
          set -euo pipefail
          target=research/paper2/blf_archetype_reconstruction_v1.json
          if [ -f "${target}" ]; then
            cmp /tmp/blf_archetype_reconstruction_v1.json "${target}"
            echo "BLF_ARCHETYPE_REPORT_BYTE_IDENTITY_PASS"
            exit 0
          fi
          cp /tmp/blf_archetype_reconstruction_v1.json "${target}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          git commit -m "Paper 2 #300: freeze generated BLF Archetype report"
          git push origin HEAD:paper2-archetype-blf-300
          echo "BLF_ARCHETYPE_REPORT_BOOTSTRAP_COMMITTED"
