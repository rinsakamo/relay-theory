name: paper2-two-pass-systemone-v3-selftest

on:
  pull_request:
    paths:
      - "research/paper2/extraction_systemone_decision_v3.schema.json"
      - "research/paper2/extraction_two_pass_systemone_v3.json"
      - "scripts/paper2_extraction_two_pass_systemone_v3.py"
      - ".github/workflows/paper2-two-pass-systemone-v3-selftest.yml"
  push:
    branches:
      - main
    paths:
      - "research/paper2/extraction_systemone_decision_v3.schema.json"
      - "research/paper2/extraction_two_pass_systemone_v3.json"
      - "scripts/paper2_extraction_two_pass_systemone_v3.py"
      - ".github/workflows/paper2-two-pass-systemone-v3-selftest.yml"

permissions:
  contents: read

jobs:
  synthetic-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact validation head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile finite decision surface and validators
        run: |
          python -m py_compile scripts/paper2_extraction_two_pass_systemone_v3.py
          python -m py_compile scripts/paper2_extraction_two_pass_systemone_v2.py
          python -m py_compile scripts/paper2_claim_ir_validate.py
          python -m py_compile scripts/paper2_extraction_procedure_validate.py
      - name: Validate committed manifest and schema, then R1-R17 and destructive mutations
        run: python scripts/paper2_extraction_two_pass_systemone_v3.py --self-test
