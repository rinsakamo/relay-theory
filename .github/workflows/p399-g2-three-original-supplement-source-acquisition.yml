name: P399 G2 three original supplementary PDFs timed primary acquisition
on:
  push:
    branches:
      - 'paper2/p399-g2-three-supplements-science-*'
  workflow_dispatch:
jobs:
  three-original-supplements-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Physical primary supplement byte retrieval and source page text anchors
        run: python3 research/paper2/p399/g2/supplement_20261005/fetch_three_official_supplements.py
      - name: Preserve independently acquired raw PDFs for reviewer audit without public Git commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p399-three-supplement-source-review-media
          path: |
            /tmp/p399_supplement_sci_20261005/*.pdf
            /tmp/p399_supplement_sci_20261005/*receipt.json
            /tmp/p399_supplement_sci_20261005/all_three_acquisition_result.json
          retention-days: 14
          if-no-files-found: warn
