name: P399 post-MAIN Self S2 handoff

on:
  push:
    branches:
      - paper2/p399-postmain-self-s2-handoff-20261006
  pull_request:
    paths:
      - 'research/paper2/p399/postmain/reintegration/R3/**'
      - '.github/workflows/p399-postmain-self-s2-handoff.yml'

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/paper2/p399/postmain/reintegration/R3/test_self_s2_handoff.py
