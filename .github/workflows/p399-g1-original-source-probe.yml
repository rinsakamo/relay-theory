name: P399 G1 original-source acquisition RECEIPTS ONLY

on:
  pull_request:
    paths:
      - "research/paper2/p399/g1/physical_original_source_receipt_probe.py"
      - ".github/workflows/p399-g1-original-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1-original-source-probe:
    name: Acquire/record provenance (NOT semantic qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reader
        run: python -m pip install --disable-pip-version-check 'pypdf==6.1.1'
      - name: Probe original publisher P05-P20 sources without publishing original bytes
        run: python research/paper2/p399/g1/physical_original_source_receipt_probe.py
      - name: Upload ONLY provenance metadata (never upload copyrighted PDF/HTML original)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p399-g1-metadata-attempt-${{ github.run_id }}
          path: g1-receipts/source-receipts.json
          if-no-files-found: warn
          retention-days: 14
