name: P399 G1 W2 source-critical issuer supplements and alternate-render research
on:
  push:
    branches: ["paper2/p399-g1-w2-ctl-prd-diversity-20261004"]
    paths:
      - ".github/workflows/p399-g1-W2-issuer-supplement-critical.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-issuer-original-supplements:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pypdf python-docx pymupdf pillow
      - name: Read exact P11 S5 issuer-origin redirect and verify full extended behavioral text
        shell: bash
        run: |
          python - <<'PY'
          import io,hashlib,requests,json
          from docx import Document
          u='https://storage.googleapis.com/plos-corpus-prod/10.1371/journal.pcbi.1008971/2/pcbi.1008971.s005.docx'
          s=requests.Session()
          r=s.get(u,timeout=65);r.raise_for_status();b=r.content
          h=hashlib.sha256(b).hexdigest()
          print('P11_S5_DIRECT_PRIOR_VERIFIED_REDIRECT_SOURCE',{'http':r.status_code,'bytes':len(b),'sha256':h,'prior_redirect_proof_run':37191315123},flush=True)
          assert h=='9c1961a7f032f32805c95d958562912abb814673ffc1657cca56d908e18335b5'
          doc=Document(io.BytesIO(b))
          for i,p in enumerate(doc.paragraphs):
             print('P11_ORIGINAL_S5_PARAGRAPH_'+str(i)+'='+p.text[:2100],flush=True)
          for i,t in enumerate(doc.tables):
             print('P11_ORIGINAL_S5_TABLE_'+str(i)+'='+' | '.join(' / '.join(c.text[:200] for c in row.cells) for row in t.rows)[:4500],flush=True)
          PY
      - name: Conditional unadmitted issuer supplement access for P12 and P17 and publisher-original eLife visuals
        shell: bash
        run: |
          python - <<'PY'
          import io,hashlib,requests,json,base64
          from pypdf import PdfReader
          from docx import Document
          from PIL import Image
          import fitz
          session=requests.Session()
          session.headers['User-Agent']='Mozilla/5.0 (RelayTheory P399 W2 original source science)'
          out=[]
          for pid,doi,exts in [
            ('P12','10.1371/journal.pcbi.1006043',['docx']*3),
            ('P17','10.1371/journal.pcbi.1009738',['pdf']*6)]:
            for n,ext in enumerate(exts,start=1):
              key='s'+str(n).zfill(3)
              errs=[]
              for version in ['2','1','3']:
                url='https://storage.googleapis.com/plos-corpus-prod/'+doi+'/'+version+'/pcbi.'+doi.split('.')[-1]+'.'+key+'.'+ext
                try:
                  r=session.get(url,timeout=18)
                  if r.status_code!=200:errs.append(version+':HTTP'+str(r.status_code));continue
                  b=r.content
                  rec={'paper':pid,'source_publisher_correlated_corpus_unproven_current_redirect':True,
                    'source_key':key,'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
                  if ext=='docx':
                    doc=Document(io.BytesIO(b));rec['paragraphs']=len(doc.paragraphs);rec['tables']=len(doc.tables)
                    print(pid+'_SOURCE_'+key+'_DOCUMENT_TEXT_START',flush=True)
                    for i,p in enumerate(doc.paragraphs):
                      if p.text.strip():print(pid+'_'+key+'_PARA_'+str(i)+'='+p.text[:800],flush=True)
                    print(pid+'_SOURCE_'+key+'_DOCUMENT_TEXT_END',flush=True)
                  else:
                    pdf=PdfReader(io.BytesIO(b),strict=False);rec['pages']=len(pdf.pages)
                    ts=[(i+1,(p.extract_text() or '')[:350]) for i,p in enumerate(pdf.pages)]
                    print(pid+'_'+key+'_SUPPLEMENT_PAGES',ts[:9],flush=True)
                  out.append(rec);print('CONDITIONAL_CORPUS_SUPPLEMENT_FETCH',rec,flush=True)
                  break
                except Exception as e: errs.append(version+':'+repr(e)[:90])
              else: print('NOT_ACQUIRED',pid,key,errs,flush=True)
          try:
            u='https://cdn.elifesciences.org/articles/39497/elife-39497-v3.pdf'
            b=session.get(u,timeout=70).content
            assert hashlib.sha256(b).hexdigest()=='c2adddf8d232d851d9decbb304fb02107686cf55a5dad4cbbfd8b0fd7ac7d64a'
            pdf=fitz.open(stream=b,filetype='pdf')
            for pi in [2,4,6,9,12,15,18]:
              im=Image.open(io.BytesIO(pdf[pi].get_pixmap(matrix=fitz.Matrix(.75,.75),alpha=False).tobytes('jpeg')))
              im.thumbnail((650,900))
              bb=io.BytesIO();im.save(bb,format='JPEG',quality=45,optimize=True)
              print('W2_ELIFE_39497_V3_PDF_PAGE_'+str(pi+1)+'_B64='+base64.b64encode(bb.getvalue()).decode(),flush=True)
          except Exception as e:
            print('ELIFE_VISUAL_UNAVAILABLE',repr(e),flush=True)
          with open('w2_original_critical_research_issuer_supplements.json','w') as f:
            json.dump({'conditional_not_automatic_qualification':True,'items':out},f,indent=2)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W2-original-issuer-supplement-research
          path: w2_original_critical_research_issuer_supplements.json
          if-no-files-found: warn
