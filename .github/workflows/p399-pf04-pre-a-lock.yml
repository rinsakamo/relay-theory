name: p399-pf04-historical-v2-regression
on:
  pull_request:
    branches: [main]
    paths:
      - "research/paper2/p399/pf04/**"
      - ".github/workflows/p399-pf04-pre-a-lock.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-negative-stop-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Historical v1/v2 negative case retention (NOT current PF04 gate)
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,math,pathlib
          root=pathlib.Path("research/paper2/p399/pf04")
          v1path=root/"PRE_A.json"
          v2path=root/"PRE_A_v2_source_math_blocker.json"
          v1=json.loads(v1path.read_bytes())
          v2=json.loads(v2path.read_bytes())
          assert v1["source"]["sha256"] == v2["source"]["sha256"]
          assert v1["source"]["pages"] == v2["source"]["pages"] == 14
          assert v1["source"]["size_bytes"] == v2["source"]["size_bytes"] == 377245
          assert v2["gate"] == "UNDERDETERMINED"
          assert len(v2["requirements"]) == 7
          assert {x["id"]:x["status"] for x in v2["requirements"]}["PREA06"] == "UNDERDETERMINED"
          assert all(x == "NOT_STARTED" for x in v2["scientific_stages"].values())
          fpath=root/"FINAL_QUALIFICATION.json"
          final=json.loads(fpath.read_bytes())
          assert final["verdict"] == "PF04_PRE_A_SOURCE_MATH_UNDERDETERMINED_NOT_QUALIFIED"
          assert final["frozen_receipts"][0]["sha256"] == hashlib.sha256(v1path.read_bytes()).hexdigest()
          assert final["frozen_receipts"][1]["sha256"] == hashlib.sha256(v2path.read_bytes()).hexdigest()
          assert all(x["status"] == "NOT_STARTED" for x in final["frozen_receipts"][3:])
          e=math.exp
          incorrect=(e(0.25)+1)/(e(0.25)+5)+4/(e(0.75)+5)
          corrected=(e(0.25)+1+4)/(e(0.25)+5)
          assert abs(incorrect-v2["decisive_blocker"]["contradiction_test"]["sum_as_printed"])<1e-14
          assert abs(incorrect-1)>0.07
          assert abs(corrected-1)<1e-14
          for p in [v1path,v2path,fpath,root/"FINAL_PRE_A_REPORT_JA.md"]:
              print("PF04_STAGE_SHA256",p,hashlib.sha256(p.read_bytes()).hexdigest(),len(p.read_bytes()))
          current=json.loads((root/"FINAL_QUALIFICATION_v2.json").read_text())
          assert current["scientific_qualification_verdict"].startswith("SOURCE_SCOPED_STRUCTURE_AND_PROCEDURE_COMPLETED")
          print("PF04_HISTORICAL_V2_REGRESSION_PASS original_pre_a_stop_preserved; latest_status=in_FINAL_QUALIFICATION_v2",incorrect)
          PY
