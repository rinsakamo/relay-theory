name: P399 G2 PRD-C isolated official source and pixel preflight
on:
  push:
    branches:
      - "paper2/p399-g2-prd-c-independent-20261004"
    paths:
      - "research/paper2/p399/g2/parallel/prd_c/**"
      - ".github/workflows/p399-g2-prd-c-source-pixel.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prd-c-publisher-pixel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5 pillow==11.3.0
      - name: Official original exact-byte and page0 visual receipt only
        run: python research/paper2/p399/g2/parallel/prd_c/prd_c_source_pixel_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G2-PRD-C-original-source-${{ github.run_id }}
          path: prd-c-evidence/
          retention-days: 14
