name: Paper 1 Review CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "paper/**"
      - ".github/workflows/paper-1-review-ci.yml"

permissions:
  contents: read

concurrency:
  group: paper-1-review-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Audit blind-review source
        shell: bash
        run: |
          set -euo pipefail
          FILE="paper/venues/philosophy-of-science/main.tex"

          if grep -Ein \
            'rinsakamo|relay[- ]?theory|github\.com|/pull/|/issues?/|sameGrounding|encodingProbe|groundedIndist|identityToken_|differentIdentityTokens|decorativeInterfaceTag|GroundingBridge|GroundingFactorization|ObservationFactorization|bridgedFeature|groundFeature_hasGroundingBridge|observeGrounded_hasObservationFactorization|factorizedObservedDifference' \
            "$FILE"; then
            echo "Potential author/repository/public-theorem identifier found in blind review source." >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("paper/venues/philosophy-of-science/main.tex").read_text()
          m = re.search(r"\\begin\{abstract\}(.*?)\\end\{abstract\}", text, re.S)
          if not m:
              raise SystemExit("abstract not found")
          words = re.findall(r"\b[\w'-]+\b", m.group(1))
          print(f"abstract_words={len(words)}")
          if len(words) > 100:
              raise SystemExit(f"abstract exceeds 100 words: {len(words)}")

          labels = set(re.findall(r"\\texttt\{R(\d+)\}", text))
          expected = {str(i) for i in range(1, 23)}
          missing = sorted(expected - labels, key=int)
          if missing:
              raise SystemExit(f"missing anonymous result labels: {missing}")
          PY

      - name: Install LaTeX toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-publishers \
            lmodern \
            poppler-utils

      - name: Build exact anonymous review copy
        shell: bash
        run: |
          set -euo pipefail
          cp paper/references.bib paper/venues/philosophy-of-science/references.bib
          cd paper/venues/philosophy-of-science

          pdflatex -interaction=nonstopmode -halt-on-error main.tex

          if command -v bibtex >/dev/null 2>&1; then
            bibtex main
          else
            bibtex8 main
          fi

          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

          test -s main.pdf

      - name: Audit final LaTeX log
        shell: bash
        run: |
          set -euo pipefail
          cd paper/venues/philosophy-of-science

          if grep -En \
            'LaTeX Warning:|Package .* Warning:|Overfull \\hbox|Underfull \\hbox|Citation .* undefined|Reference .* undefined' \
            main.log; then
            echo "Final review-copy LaTeX log contains warnings or layout defects." >&2
            exit 1
          fi

          PAGES="$(pdfinfo main.pdf | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')"
          test -n "$PAGES"

          pdftotext main.pdf main.txt
          grep -F "When May a Formal Difference" main.txt
          grep -F "Acknowledgements" main.txt
          grep -F "R12" main.txt

          {
            echo "### Paper 1 anonymous review validation"
            echo
            printf -- '- Validated SHA: %s\n' "$(git rev-parse HEAD)"
            printf -- '- PDF pages: %s\n' "$PAGES"
            echo '- Abstract: <=100 words'
            echo '- Blind-source audit: PASS'
            echo '- Final LaTeX warning/layout audit: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact anonymous review PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-1-philosophy-of-science-review-pdf
          path: paper/venues/philosophy-of-science/main.pdf
          if-no-files-found: error
          retention-days: 14
