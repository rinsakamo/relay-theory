name: P399 post-MAIN Self S18 reconciliation

on:
  push:
    branches:
      - paper2/p399-postmain-self-s18-reconciliation-20261007
  pull_request:
    paths:
      - 'research/paper2/p399/postmain/reintegration/R6/**'
      - '.github/workflows/p399-postmain-self-s18-reconciliation.yml'

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/paper2/p399/postmain/reintegration/R6/test_self_s18_reconciliation.py
