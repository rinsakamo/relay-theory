name: P399 G2-D INT publisher-only original receipt probe
on:
  pull_request:
    paths:
      - "research/paper2/p399/g2/int_g2d/**"
      - ".github/workflows/p399-g2d-int-original.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  int-original-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - name: Deterministic fail-closed metadata and negative tests (NOT source scientific validation)
        run: python research/paper2/p399/g2/int_g2d/test_bounded_decisions.py
      - name: Bounded firstparty INT source retries and version evidence (NO original bytes uploaded)
        run: python research/paper2/p399/g2/int_g2d/source_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2d-int-physical-source-attempts-${{ github.run_id }}
          path: g2d-int-receipts/physical_attempts.json
          if-no-files-found: warn
          retention-days: 14
