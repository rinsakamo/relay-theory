name: paper2-eligibility-runner-selftest

on:
  pull_request:
    paths:
      - "research/paper2/eligibility_runner_v1.json"
      - "research/paper2/eligibility_runner_config_v1.schema.json"
      - "research/paper2/eligibility_runner_config_v1.example.json"
      - "research/paper2/eligibility_adjudication_disagreement_prompt_v1.md"
      - "research/paper2/eligibility_adjudication_v1.json"
      - "research/paper2/eligibility_adjudication_prompt_v1.md"
      - "scripts/paper2_eligibility_adjudication_validate.py"
      - "scripts/paper2_eligibility_openai_runner.py"
      - ".github/workflows/paper2-eligibility-runner-selftest.yml"
  push:
    branches:
      - main
    paths:
      - "research/paper2/eligibility_runner_v1.json"
      - "research/paper2/eligibility_runner_config_v1.schema.json"
      - "research/paper2/eligibility_runner_config_v1.example.json"
      - "research/paper2/eligibility_adjudication_disagreement_prompt_v1.md"
      - "research/paper2/eligibility_adjudication_v1.json"
      - "research/paper2/eligibility_adjudication_prompt_v1.md"
      - "scripts/paper2_eligibility_adjudication_validate.py"
      - "scripts/paper2_eligibility_openai_runner.py"
      - ".github/workflows/paper2-eligibility-runner-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile eligibility runner
        run: |
          python -m py_compile scripts/paper2_eligibility_adjudication_validate.py
          python -m py_compile scripts/paper2_eligibility_openai_runner.py
      - name: Run mock execute-once eligibility runner self-test
        run: python scripts/paper2_eligibility_openai_runner.py --self-test
