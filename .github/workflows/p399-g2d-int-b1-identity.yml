name: P399 G2-D INT B1 exact publisher identity recheck
on:
  pull_request:
    paths:
      - "research/paper2/p399/g2/int_g2d/b1_targeted_identity_recheck.py"
      - ".github/workflows/p399-g2d-int-b1-identity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b1-identity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pypdf==6.1.1
      - name: Actual publisher original B1 independent PDF+HTML source identity
        run: python research/paper2/p399/g2/int_g2d/b1_targeted_identity_recheck.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2d-int-b1-source-identity-${{ github.run_id }}
          path: g2d-int-b1/publisher_identity.json
          retention-days: 14
          if-no-files-found: warn
