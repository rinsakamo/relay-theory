name: paper2-designed-source-capture-assembly-selftest

on:
  pull_request:
    paths:
      - "research/paper2/designed_source_capture_assembly_v1.json"
      - "research/paper2/designed_source_capture_input_v1.schema.json"
      - "research/paper2/designed_masked_source_surface_v1.schema.json"
      - "research/paper2/designed_blinded_source_bundle_v1.schema.json"
      - "research/paper2/designed_source_capture_manifest_v1.*"
      - "research/paper2/extraction_label_mask_v1.json"
      - "scripts/paper2_extraction_two_pass_prepare.py"
      - "scripts/paper2_designed_source_capture_assemble.py"
      - "scripts/paper2_designed_source_capture_scaffold.py"
      - "scripts/paper2_designed_source_capture_validate.py"
      - ".github/workflows/paper2-designed-source-capture-assembly-selftest.yml"
  push:
    branches: [main]
    paths:
      - "research/paper2/designed_source_capture_assembly_v1.json"
      - "research/paper2/designed_source_capture_input_v1.schema.json"
      - "research/paper2/designed_masked_source_surface_v1.schema.json"
      - "research/paper2/designed_blinded_source_bundle_v1.schema.json"
      - "research/paper2/designed_source_capture_manifest_v1.*"
      - "research/paper2/extraction_label_mask_v1.json"
      - "scripts/paper2_extraction_two_pass_prepare.py"
      - "scripts/paper2_designed_source_capture_assemble.py"
      - "scripts/paper2_designed_source_capture_validate.py"
      - ".github/workflows/paper2-designed-source-capture-assembly-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile capture apparatus
        run: |
          python -m py_compile scripts/paper2_designed_source_capture_validate.py
          python -m py_compile scripts/paper2_designed_source_capture_assemble.py
          python -m py_compile scripts/paper2_designed_source_capture_scaffold.py
      - name: Parse capture contracts
        run: |
          python -m json.tool research/paper2/designed_source_capture_assembly_v1.json >/dev/null
          python -m json.tool research/paper2/designed_source_capture_input_v1.schema.json >/dev/null
          python -m json.tool research/paper2/designed_masked_source_surface_v1.schema.json >/dev/null
          python -m json.tool research/paper2/designed_blinded_source_bundle_v1.schema.json >/dev/null
      - name: Revalidate pre-text descriptor
        run: python scripts/paper2_designed_source_capture_validate.py
      - name: Run destructive zero-model capture-assembly self-test
        run: python scripts/paper2_designed_source_capture_assemble.py --self-test
      - name: Run local capture-scaffold self-test
        run: python scripts/paper2_designed_source_capture_scaffold.py --self-test
      - name: Verify pre-text descriptor digest
        run: sha256sum -c research/paper2/designed_source_capture_manifest_v1.sha256
