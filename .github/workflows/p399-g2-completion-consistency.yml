name: P399 G2 completion ledger fail-closed consistency (NOT scientific source admission)
on:
  pull_request:
    paths:
      - "research/paper2/p399/g2/**"
      - ".github/workflows/p399-g2-completion-consistency.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g2-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python research/paper2/p399/g2/g2_working_completion_consistency.py
