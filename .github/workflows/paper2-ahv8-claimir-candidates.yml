name: paper2-ahv8-claimir-candidates

on:
  push:
    branches:
      - paper2-ahv8-claimir-379
    paths:
      - "paper/validation/jgps-major-revision/ahv8-*"
      - "scripts/paper2_ahv8_claimir_candidate_validate.py"
      - "scripts/paper2_claim_ir_validate.py"
      - ".github/workflows/paper2-ahv8-claimir-candidates.yml"
  pull_request:
    paths:
      - "paper/validation/jgps-major-revision/ahv8-*"
      - "scripts/paper2_ahv8_claimir_candidate_validate.py"
      - "scripts/paper2_claim_ir_validate.py"
      - ".github/workflows/paper2-ahv8-claimir-candidates.yml"

permissions:
  contents: read

jobs:
  ahv8-claimir-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/paper2_claim_ir_validate.py scripts/paper2_ahv8_claimir_candidate_validate.py
      - name: Validate twice and compare
        run: |
          PYTHONPATH=scripts python scripts/paper2_ahv8_claimir_candidate_validate.py --output /tmp/ahv-cand-a.json
          PYTHONPATH=scripts python scripts/paper2_ahv8_claimir_candidate_validate.py --output /tmp/ahv-cand-b.json
          cmp /tmp/ahv-cand-a.json /tmp/ahv-cand-b.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: paper2-ahv8-claimir-candidate-receipt
          path: /tmp/ahv-cand-a.json
