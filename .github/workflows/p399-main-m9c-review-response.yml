name: P399 MAIN M9C review response

on:
  workflow_dispatch:
  push:
    branches:
      - paper2/p399-main-m9c-review-response-20261005
  pull_request:
    branches:
      - paper2/p399-main-m9b-auditability-20261005

permissions:
  contents: read

concurrency:
  group: p399-main-m9c-review-response-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m9c-review-response:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact M9C base ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE="568aa41ead6c246120aa449b48c57a2e99094ef1"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-list --count "${BASE}..HEAD")" -ge 1

      - name: Enforce M9C isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="568aa41ead6c246120aa449b48c57a2e99094ef1"
          cat > "$RUNNER_TEMP/expected-m9c-paths.txt" <<'EOF'
          .github/workflows/p399-main-m9c-review-response.yml
          paper/venues/jgps/main.tex
          paper/venues/jgps/response-to-reviewers.md
          research/paper2/p399/main/integration/M9C/M9C_HOSTILE_REVIEW_RESPONSE_MATRIX_v1.json
          research/paper2/p399/main/integration/M9C/M9C_HOSTILE_REVIEW_RESPONSE_MATRIX_v1.md
          research/paper2/p399/main/integration/M9C/test_m9c_review_response.py
          EOF
          git diff --name-only "${BASE}..HEAD" | sort > "$RUNNER_TEMP/actual-m9c-paths.txt"
          diff -u "$RUNNER_TEMP/expected-m9c-paths.txt" "$RUNNER_TEMP/actual-m9c-paths.txt"

      - name: Re-run inherited M9A and M9B semantic guards
        shell: bash
        run: |
          set -euo pipefail
          python research/paper2/p399/main/integration/M9A/test_m9a_categorical_lifts.py
          python research/paper2/p399/main/integration/M9B/test_m9b_auditability.py

      - name: Run M9C response guardrails
        shell: bash
        run: |
          set -euo pipefail
          python research/paper2/p399/main/integration/M9C/test_m9c_review_response.py

      - name: Install LaTeX build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra texlive-pictures \
            poppler-utils

      - name: Build M9C JGPS manuscript fail-closed
        shell: bash
        run: |
          set -euo pipefail
          cd paper/venues/jgps
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -En 'LaTeX Warning:|Package .* Warning:|Overfull \\hbox|Citation .* undefined|Reference .* undefined' main.log; then exit 1; fi
          pdfinfo main.pdf | grep -F "Pages:"
          echo "M9C_JGPS_BUILD_PASS" >> "$GITHUB_STEP_SUMMARY"
