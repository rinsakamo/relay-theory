name: P399 G1 W3 alternative original and supplements acquisition
on:
  push:
    branches:
      - paper2/p399-g1-w3-mem-prd-family-20261004
    paths:
      - .github/workflows/p399-g1-W3-alternative-primary-source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alternative_source_acquisition_not_qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF signature and page verifier
        run: python -m pip install --quiet pypdf
      - name: Acquire bounded PLOS, archival, and institutional original source variants
        run: python research/paper2/p399/g1/parallel/W3/W3_alternative_original_primary_source_probe.py
      - name: Retain exact bytes, pages and original-SHA comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W3-independent-source-variants-${{ github.run_id }}
          path: ${{ runner.temp }}/W3_alternative_original_source_probe_v1.json
          if-no-files-found: error
          retention-days: 30
