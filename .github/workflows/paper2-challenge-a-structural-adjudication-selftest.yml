name: paper2-challenge-a-structural-adjudication-selftest

on:
  pull_request:
    paths:
      - "research/paper2/reference_structural_adjudication_v1/CH01.json"
      - "research/paper2/reference_structural_adjudication_v1/CH03.json"
      - "research/paper2/reference_structural_adjudication_v1/CH05.json"
      - "research/paper2/reference_structural_adjudication_v1/CH07.json"
      - "research/paper2/reference_structural_adjudication_v1/CH09.json"
      - "research/paper2/reference_structural_adjudication_v1/CH11.json"
      - ".github/workflows/paper2-challenge-a-structural-adjudication-selftest.yml"

permissions:
  contents: read

jobs:
  validate-challenge-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile frozen checkers
        run: |
          python -m py_compile scripts/paper2_reference_structural_adjudication.py
          python -m py_compile scripts/paper2_phi_compare.py

      - name: Run frozen structural-adjudication self-test
        run: python scripts/paper2_reference_structural_adjudication.py --self-test

      - name: Guard Challenge A scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          bad="$(grep '^research/paper2/reference_structural_adjudication_v1/CH[0-9][0-9]\.json$' /tmp/changed.txt | grep -Ev '/(CH01|CH03|CH05|CH07|CH09|CH11)\.json$' || true)"
          if [ -n "$bad" ]; then
            echo "Out-of-lane challenge adjudication changed:"
            echo "$bad"
            exit 1
          fi
          if grep -q '^\.github/workflows/paper2-reference-structural-adjudication-selftest\.yml$' /tmp/changed.txt; then
            echo "Shared #268 workflow must not be edited by Challenge A lane"
            exit 1
          fi

      - name: Compile and project changed Challenge A claims
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed.txt
          for CLAIM in CH01 CH03 CH05 CH07 CH09 CH11; do
            ADJ="research/paper2/reference_structural_adjudication_v1/$CLAIM.json"
            if ! grep -qx "$ADJ" /tmp/changed.txt; then
              continue
            fi

            python scripts/paper2_reference_structural_adjudication.py \
              --claim-ir "research/paper2/chatgpt_reference_claimir_v1/$CLAIM.json" \
              --adjudication "$ADJ" \
              --output "/tmp/$CLAIM.structural.json"

            python scripts/paper2_phi_compare.py \
              --project "/tmp/$CLAIM.structural.json" \
              > "/tmp/$CLAIM.phi.json"

            python -m json.tool "/tmp/$CLAIM.structural.json" >/dev/null
            python -m json.tool "/tmp/$CLAIM.phi.json" >/dev/null

            echo "=== $CLAIM ==="
            sha256sum "/tmp/$CLAIM.structural.json"
            sha256sum "/tmp/$CLAIM.phi.json"

            python - "$CLAIM" <<'PY'
import json, pathlib, sys
claim = sys.argv[1]
obj = json.loads(pathlib.Path(f"/tmp/{claim}.structural.json").read_text())
attempt = obj["paper"]["claims"][0]["claim_ir_records"][0]["decomposition_attempts"][0]
print(f"{claim} validation=PASS outcome={attempt['outcome']['status']}")
PY
          done
