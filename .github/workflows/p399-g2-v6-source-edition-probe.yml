name: P399 G2 source-v6 official publisher versus archive edition discrimination
on:
  push:
    branches:
      - "paper2/p399-g2-outcome-blind-main40-working-20261004"
    paths:
      - "research/paper2/p399/g2/g2_v6_primary_archive_edition_probe.py"
      - ".github/workflows/p399-g2-v6-source-edition-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-edition-discrimination:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - run: python research/paper2/p399/g2/g2_v6_primary_archive_edition_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-v6-edition-source-receipts-${{ github.run_id }}
          path: g2-v6/restricted_origin_and_edition_metadata.json
          if-no-files-found: warn
          retention-days: 14
