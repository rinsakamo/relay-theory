name: P399 MAIN M10 major-revision guards

on:
  pull_request:
    paths:
      - 'research/paper2/p399/main/integration/M10/**'
      - 'scripts/paper2_m10_major_revision_audit.py'
      - 'paper/venues/jgps/**'
      - '.github/workflows/p399-main-m10-major-revision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m10-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact head and run deterministic M10 guards
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python scripts/paper2_m10_major_revision_audit.py
          ! grep -F '\\paragraph{' paper/venues/jgps/main.tex
          grep -F 'Cognitive-capacity labels are at most prima facie guides to individuation' paper/venues/jgps/main.tex
          grep -F 'Procedural auditability is established; inter-rater reliability remains unmeasured.' paper/venues/jgps/main.tex
          if test -f research/paper2/p399/main/integration/M17/M17_SPEC_v1.json; then
            grep -F 'All 40 could be reconstructed without adding a new coordinating mechanism' paper/venues/jgps/main.tex
          else
            grep -F 'A0=40,A1=0,A2=0' paper/venues/jgps/main.tex
          fi

      - name: Install strict LaTeX build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra texlive-pictures \
            poppler-utils

      - name: Strict build JGPS manuscript
        run: |
          set -euo pipefail
          cd paper/venues/jgps
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -En 'LaTeX Warning:|Package .* Warning:|Overfull \\hbox|Citation .* undefined|Reference .* undefined' main.log; then
            exit 1
          fi
          pdftotext main.pdf main.txt
          tr '\n' ' ' < main.txt | tr -s '[:space:]' ' ' > main.flat.txt
          grep -F 'Cognitive-capacity labels are at most prima facie guides to individuation' main.flat.txt
          grep -E '1770[[:space:]]*/[[:space:]]*1770' main.flat.txt
          if test -f ../../../research/paper2/p399/main/integration/M17/M17_SPEC_v1.json; then
            grep -F '206 unique reusable structural subobjects' main.flat.txt || grep -F '206 unique reusable' main.flat.txt || grep -F '206 reusable' main.flat.txt
          else
            grep -F '206 unique reusable structural subobjects' main.flat.txt
          fi
          grep -F 'inter-rater reliability remains unmeasured' main.flat.txt
          PAGES="$(pdfinfo main.pdf | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')"
          echo "JGPS manuscript pages: $PAGES" | tee page-count.txt
          echo "JGPS manuscript pages: $PAGES" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: paper-2-m10-jgps-manuscript-pdf
          path: |
            paper/venues/jgps/main.pdf
            paper/venues/jgps/page-count.txt
          if-no-files-found: error
          retention-days: 14
