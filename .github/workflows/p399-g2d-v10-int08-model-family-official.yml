name: P399 G2-D v10 INT08 official published model-family comparator source
on:
  pull_request:
    paths:
      - "research/paper2/p399/g2/int_g2d/v10_int08_firstparty_comparator_exact_pdf_or_browser.py"
      - ".github/workflows/p399-g2d-v10-int08-model-family-official.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-firstparty-comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pypdf==6.1.1 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Official eLife exact inherited selected INT08 raw SHA timed 12s; fallback Chromium
        run: python research/paper2/p399/g2/int_g2d/v10_int08_firstparty_comparator_exact_pdf_or_browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2d-v10-publisher-elife-int08-firstparty-${{ github.run_id }}
          path: g2d-v10-elife-int08-firstparty/executed.json
          if-no-files-found: warn
          retention-days: 14
