name: paper2-two-pass-systemone-selftest

on:
  pull_request:
    paths:
      - "research/paper2/extraction_two_pass_systemone_v1.json"
      - "research/paper2/extraction_systemone_decision_v1.schema.json"
      - "scripts/paper2_extraction_two_pass_systemone.py"
      - "scripts/paper2_extraction_procedure_validate.py"
      - "scripts/paper2_extraction_bundle_prepare.py"
      - ".github/workflows/paper2-two-pass-systemone-selftest.yml"
  push:
    branches:
      - main
    paths:
      - "research/paper2/extraction_two_pass_systemone_v1.json"
      - "research/paper2/extraction_systemone_decision_v1.schema.json"
      - "scripts/paper2_extraction_two_pass_systemone.py"
      - "scripts/paper2_extraction_procedure_validate.py"
      - "scripts/paper2_extraction_bundle_prepare.py"
      - ".github/workflows/paper2-two-pass-systemone-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile two-pass extraction qualification
        run: |
          python -m py_compile scripts/paper2_extraction_bundle_prepare.py
          python -m py_compile scripts/paper2_extraction_procedure_validate.py
          python -m py_compile scripts/paper2_extraction_two_pass_systemone.py
      - name: Revalidate frozen extraction candidate contract
        run: python scripts/paper2_extraction_procedure_validate.py --self-test
      - name: Run synthetic Normal to SystemOne qualification
        run: python scripts/paper2_extraction_two_pass_systemone.py --self-test
